[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-elite-swr"
version = "8.1.1"
description = "Synthetic Worldview Reconstruction (SWR) applied to the AI Elite — Open Research Repository & Data Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "Lukas Geiger" }
]
keywords = [
    "synthetic-worldview-reconstruction",
    "swr",
    "ai-elite",
    "ai-governance",
    "llm-assisted-sociology",
    "belief-system-analysis",
    "open-science"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/research-line/ai-elite-swr"
Repository = "https://github.com/research-line/ai-elite-swr.git"
Documentation = "https://github.com/research-line/ai-elite-swr#readme"
"Paper A DOI" = "https://doi.org/10.5281/zenodo.20686161"
"Paper B DOI" = "https://doi.org/10.5281/zenodo.20260688"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["_data_A/tools"]
python_files = ["check_*.py", "verify_*.py", "test_*.py"]
pythonpath = "."
